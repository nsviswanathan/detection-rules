title: Credential Manager Abuse via cmdkey
status: experimental
description: Detects cmdkey usage to add stored credentials
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  product: windows
  category: process_creation
detection:
  cmdkey:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains: '/add'
  condition: cmdkey
falsepositives:
  - Legit saved credentials
level: medium
