title: Multiple Network Logons from Single Source (Possible Lateral Movement)
status: experimental
description: Detects multiple network logons (Type 3) from a single source workstation
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  product: windows
  category: authentication
detection:
  network_logon:
    LogonType: 3
  condition: network_logon
falsepositives:
  - File servers or management servers
level: medium
