title: Encoded PowerShell Command Execution
status: experimental
description: Detects PowerShell execution with base64 encoded commands
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
  condition: selection
falsepositives:
  - Legitimate automation scripts
level: medium
