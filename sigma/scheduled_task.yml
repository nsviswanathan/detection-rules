title: Suspicious Scheduled Task Creation
status: experimental
description: Detects creation of scheduled tasks via schtasks.exe
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  schtasks_exec:
    Image|endswith: '\schtasks.exe'
  task_create:
    CommandLine|contains:
      - '/create'
  suspicious_target:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
  condition: schtasks_exec and task_create and suspicious_target
falsepositives:
  - Legitimate admin-created scheduled tasks
level: high
